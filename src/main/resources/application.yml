spring:
  application:
    name: distributed-job-scheduler
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: scheduler
    password: scheduler
    hikari:
      maximum-pool-size: 30
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        "[enable.idempotence]": true
        "[linger.ms]": 0
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.value.default.type]": com.example.scheduler.messaging.DispatchMessage
        "[spring.json.trusted.packages]": com.example.scheduler.messaging
        "[spring.json.use.type.headers]": false
    listener:
      ack-mode: manual
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

scheduler:
  roles:            # one codebase, deploy as separate services by toggling roles
    api: true
    engine: true
    worker: true
    recovery: true
  topics:
    dispatch: job.dispatch
    dlt: job.dlt
    partitions: 64
  picker:
    poll-ms: 100
    batch-size: 500
    lease-seconds: 30
  loader:
    horizon-minutes: 10
  worker:
    max-concurrent: 200
    listener-concurrency: 4
    lease-seconds: 30
    heartbeat-seconds: 5
  tenant:
    rate-limit-per-second: 1000
  executors:
    shell:
      enabled: false
      allowed-commands: []
